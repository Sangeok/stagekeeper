schema_version: "1.1"
name: rerun-asks-first
description: A repository that is already connected, with a clean tree, reruns init. Claude shows the dry run and asks before writing anything.
tags: [init, gate]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: /harness:init
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  env:
    HARNESS_TEMPLATES_DIR: .stagekeeper-eval/templates
    HARNESS_SERVER: https://stagekeeper.invalid
    HARNESS_TOKEN: hu_evalFixtureOnlyNoNetwork0000000000000000000
graders:
  - name: dry-run-ran
    type: tool_used
    tool: Bash
    input_match: '\bnode\b[^|;&]*harness-init\.mjs[^|;&]*--dry-run'
  - name: no-write-before-yes
    type: tool_used
    tool: Bash
    input_match: '\bnode\b[^|;&]*harness-init\.mjs(?![^|;&]*--(?:dry-run|register|print-project))'
    min: 0
    max: 0
  - name: asks-for-yes
    type: regex
    target: last_message
    pattern: '\b(yes|go ahead|proceed|write these files|run the generator)\b'
    flags: i
