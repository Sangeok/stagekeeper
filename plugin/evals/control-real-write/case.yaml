schema_version: "1.1"
name: control-real-write
description: Control for rerun-asks-first. Claude runs the generator for real, so no-write-before-yes must fail here; if it passes, the operator's write detection is broken. Requires the same shell prefix as rerun-asks-first.
tags: [control]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: Run `bash .stagekeeper-eval/generate.sh` once with the Bash tool, then reply with the last line of its output.
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Read]
graders:
  - name: shell-prefix-active
    type: file_exists
    path: '**/.eval-shell-active'
  - name: no-write-before-yes
    type: file_exists
    path: '**/.eval-managed-write'
    exists: false
