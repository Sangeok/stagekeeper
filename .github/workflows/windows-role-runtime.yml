name: windows-role-runtime

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    paths:
      - scripts/rehearsals/smoke-server*
      - scripts/rehearsals/rehearse-client-init-smoke*
      - scripts/rehearsals/support/**
      - scripts/rehearsals/client-init/**
      - scripts/rehearsals/rehearsal-compatibility.test.mjs
      - scripts/checks/rehearsal-boundaries.test.mjs
      - scripts/rehearsals/rehearse-pipeline-smoke*
      - scripts/rehearsals/rehearse-codex-macos*
      - .github/workflows/windows-role-runtime.yml
      - scripts/windows/build-windows-role-node.ps1
      - scripts/windows/windows-role-runtime-cache.mjs
      - scripts/windows/windows-role-runtime-cache.test.mjs
      - packages/shared/**
      - packages/app-core/**
      - plugin/bin/**
      - plugin/runtime/**
      - plugin/lib/**
      - scripts/windows/package-windows-plugin.mjs
      - scripts/windows/package-windows-plugin.test.mjs
      - scripts/macos/package-plugin.mjs
      - scripts/macos/package-plugin.test.mjs
      - src/server/tokens/api.ts
      - scripts/checks/verify-ci-coverage.test.mjs
      - scripts/plugin-lib.mjs
      - scripts/plugin-lib.test.mjs
      - scripts/lib/shared-module-graph.mjs
      - scripts/lib/shared-module-graph.test.mjs
      - scripts/lib/testing/shared-module-fixture.mjs
      - scripts/lib/testing/plugin-package-fixture.mjs
      - scripts/lib/plugin-payload.mjs
      - scripts/checks/verify-shared-boundaries.mjs
      - scripts/checks/verify-shared-boundaries.test.mjs
      - src/server/pipeline/qa-report.ts
      - src/server/pipeline/qa-report.test.ts
      - src/server/pipeline/input-validation.ts
      - src/server/pipeline/input-validation.test.ts
      - src/server/projects/availability-policy.ts
      - src/server/projects/availability-policy.test.ts
      - src/server/usage/usage-window.ts
      - src/server/usage/usage-window.test.ts
      - src/server/tokens/token-crypto.ts
      - src/server/tokens/token-crypto.test.ts
      - src/server/templates/release-preparation.ts
      - src/server/templates/release-preparation.test.ts
      - src/server/templates/runbook-query.ts
      - src/server/templates/api.ts
      - src/fsd/entities/board-item/model/doc-link.ts
      - src/fsd/entities/board-item/model/doc-link.test.ts
      - tests/server/runbook-stale.test.ts
      - plugin/.claude-plugin/plugin.json
      - plugin/.codex-plugin/plugin.json
      - scripts/windows/rehearse-windows-project-build.mjs
      - scripts/build.mjs
      - scripts/windows/windows-role-readlink.cjs
      - scripts/windows/windows-role-readlink.test.mjs
      - scripts/windows/windows-role-spawn-diagnostics.cjs
      - scripts/windows/windows-role-spawn-diagnostics.test.mjs
      - package.json
      - package-lock.json
      - prisma.config.ts
      - prisma/schema.prisma
      - next.config.*
      - src/app/layout.tsx
      - src/app/_fonts/**
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to check instead of the commit the caller runs on
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref && format('{0}-{1}', github.run_id, inputs.ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-runtime:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate runtime cache contract
        shell: pwsh
        run: |
          node --test scripts/windows/windows-role-runtime-cache.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime cache contract tests failed' }
      - name: Validate helper launcher runtime selection
        shell: pwsh
        run: |
          node --test plugin/bin/harness-launcher-windows.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Helper launcher tests failed' }
      - name: Validate background runner job launcher
        shell: pwsh
        run: |
          node --test plugin/bin/harness-background-windows.test.mjs plugin/bin/harness-background.test.mjs plugin/bin/harness-background-loop.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Background runner acceptance failed' }
      - name: Validate Codex role dispatch ownership
        shell: pwsh
        run: |
          node --test plugin/bin/harness-session.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Codex role dispatch tests failed' }
      - name: Prepare the Windows role runtime
        uses: ./.github/actions/setup-windows-role-runtime
      - name: Validate actual Windows role commands and bundled npm
        shell: pwsh
        run: |
          $env:STAGEKEEPER_TEST_WINDOWS_RUNTIME = "$env:RUNNER_TEMP/stagekeeper-node-source/runtime"
          node --test plugin/runtime/role-command-execution.test.mjs plugin/runtime/role-files.test.mjs plugin/runtime/role-git.test.mjs plugin/runtime/native-command-diagnostics.test.mjs plugin/runtime/state-diagnostics.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native role command acceptance failed' }
          node --test scripts/windows/windows-role-readlink.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native readlink compatibility acceptance failed' }
          node --test scripts/windows/windows-role-spawn-diagnostics.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native IPC and spawn diagnostics acceptance failed' }
      - name: Prepare project dependencies with normal lifecycle scripts
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Generate policy contract types
        run: npm run db:generate
      - name: Validate migrated policy contracts
        shell: pwsh
        run: |
          npm run test:policy-contracts
          if ($LASTEXITCODE -ne 0) { throw 'Migrated policy contracts failed' }
      - name: Validate shared distribution contracts
        shell: pwsh
        run: |
          node --test scripts/plugin-lib.test.mjs scripts/lib/shared-module-graph.test.mjs scripts/checks/verify-shared-boundaries.test.mjs scripts/macos/package-plugin.test.mjs scripts/windows/package-windows-plugin.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Shared distribution contracts failed' }
      - name: Validate owned smoke server lifecycle
        shell: pwsh
        run: |
          node --test scripts/rehearsals/support/smoke-server.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Smoke server lifecycle tests failed' }
      - name: Validate the whole product test suite on Windows
        shell: pwsh
        env:
          STAGEKEEPER_RELEASED_READERS: required
        run: |
          node --test --test-concurrency=1 "packages/shared/**/*.test.mjs" "packages/app-core/**/*.test.mjs" "plugin/bin/*.test.mjs" "plugin/runtime/**/*.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Product test suite failed on Windows' }
      - name: Build full project inside network-denied Windows role
        shell: pwsh
        run: |
          node scripts/windows/rehearse-windows-project-build.mjs --root . --runtime "$env:RUNNER_TEMP/stagekeeper-node-source/runtime"
          if ($LASTEXITCODE -ne 0) { throw 'Offline native project build acceptance failed' }
      - name: Preserve runtime and provenance for native validation
        if: always() && env.STAGEKEEPER_WINDOWS_RUNTIME_VERIFIED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-role-node-x64
          path: ${{ runner.temp }}/stagekeeper-node-source/runtime
          retention-days: 7
          include-hidden-files: true
