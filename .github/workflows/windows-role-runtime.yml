name: windows-role-runtime

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/windows-role-runtime.yml
      - scripts/build-windows-role-node.ps1
      - plugin/runtime/windows/**
      - plugin/runtime/role-commands.mjs
      - plugin/bin/harness-role-commands.test.mjs
      - scripts/rehearse-windows-project-build.mjs
      - scripts/build.mjs
      - scripts/windows-role-readlink.cjs
      - scripts/windows-role-readlink.test.mjs
      - package.json
      - package-lock.json
      - prisma.config.ts
      - prisma/schema.prisma
      - next.config.*
      - src/**

permissions:
  contents: read

jobs:
  native-runtime:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/stagekeeper-node-source
          key: windows-node-22.23.3-${{ hashFiles('scripts/build-windows-role-node.ps1') }}
      - name: Build pinned Node with AppContainer pipe backport
        shell: pwsh
        run: ./scripts/build-windows-role-node.ps1 -BuildRoot "$env:RUNNER_TEMP/stagekeeper-node-source"
      - name: Validate actual Windows role commands and bundled npm
        shell: pwsh
        run: |
          $env:STAGEKEEPER_TEST_WINDOWS_RUNTIME = "$env:RUNNER_TEMP/stagekeeper-node-source/runtime"
          node --test plugin/bin/harness-role-commands.test.mjs plugin/bin/harness-role-files.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native role command acceptance failed' }
          node --test scripts/windows-role-readlink.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native readlink compatibility acceptance failed' }
      - name: Prepare project dependencies with normal lifecycle scripts
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Build full project inside network-denied Windows role
        shell: pwsh
        run: |
          node scripts/rehearse-windows-project-build.mjs --root . --runtime "$env:RUNNER_TEMP/stagekeeper-node-source/runtime"
          if ($LASTEXITCODE -ne 0) { throw 'Offline native project build acceptance failed' }
      - name: Preserve runtime and provenance for native validation
        uses: actions/upload-artifact@v4
        with:
          name: windows-role-node-x64
          path: ${{ runner.temp }}/stagekeeper-node-source/runtime
          retention-days: 7
          include-hidden-files: true
