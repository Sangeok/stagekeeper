name: tmp-windows-guard

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  background:
    name: background windows-2022 ${{ matrix.variant }} ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore the guard as it was before the fix
        if: matrix.variant == 'before'
        shell: bash
        run: git checkout origin/dev -- plugin/runtime/local-session.mjs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare project dependencies with normal lifecycle scripts
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Generate policy contract types
        run: npm run db:generate
      - name: Repeat harness-background under load
        shell: pwsh
        env:
          STAGEKEEPER_RELEASED_READERS: required
        run: node .github/tmp/stress.mjs --file=plugin/bin/harness-background.test.mjs --rounds=7 --parallel=3 --label=harness-background-windows-${{ matrix.variant }}-${{ matrix.shard }}
  guard-race:
    name: guard race ${{ matrix.runner }} ${{ matrix.variant }} ${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022]
        variant: [before, after]
        shard: [1, 2, 3]
        include:
          - runner: macos-15-intel
            variant: after
            shard: 1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore the guard as it was before the fix
        if: matrix.variant == 'before'
        shell: bash
        run: git checkout origin/dev -- plugin/runtime/local-session.mjs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Take and release the same guard from four processes
        env:
          GUARD_RACE_SECONDS: "60"
          GUARD_RACE_WORKERS: "4"
        run: node .github/tmp/guard-race.mjs
