name: pipeline-smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: template-transcript-inspection-41760230941
  cancel-in-progress: false

jobs:
  inspect:
    name: inspect encrypted run 41760230941
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download the specific sealed transcript
        uses: actions/download-artifact@v4
        with:
          name: pipeline-smoke-transcripts
          run-id: 41760230941
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sealed-source
      - name: Re-encrypt in memory for the local inspection recipient
        env:
          TRANSCRIPT_KEY: ${{ secrets.E2E_TRANSCRIPT_KEY }}
        run: node scripts/rehearsals/rewrap-pipeline-transcripts.mjs "$RUNNER_TEMP/sealed-source/pipeline-transcripts.bin" "$RUNNER_TEMP/private-inspection.json"
      - uses: actions/upload-artifact@v4
        with:
          name: private-inspection-41760230941
          path: ${{ runner.temp }}/private-inspection.json
          retention-days: 1
          if-no-files-found: error
