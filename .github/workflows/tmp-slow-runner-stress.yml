name: tmp-slow-runner-stress

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: stress macos-15-intel ${{ matrix.variant }} ${{ matrix.shard }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore the tests as they were before the fix
        if: matrix.variant == 'before'
        shell: bash
        run: git checkout origin/dev -- plugin/bin/harness-watch.test.mjs plugin/bin/harness-background.test.mjs scripts/windows/windows-role-readlink.test.mjs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - name: Build the verified native macOS runtime
        shell: bash
        run: |
          architecture="$(node -p process.arch)"
          archive="$RUNNER_TEMP/node-v22.23.3-darwin-$architecture.tar.gz"
          curl -fsSL "https://nodejs.org/dist/v22.23.3/node-v22.23.3-darwin-$architecture.tar.gz" -o "$archive"
          node scripts/macos/build-runtime.mjs --archive "$archive" --output "$GITHUB_WORKSPACE/plugin/runtime/macos/node"
      - name: Repeat harness-watch under load
        env:
          STAGEKEEPER_MACOS_RUNTIME_REQUIRED: "1"
          STAGEKEEPER_RELEASED_READERS: required
        run: node .github/tmp/stress.mjs --file=plugin/bin/harness-watch.test.mjs --rounds=7 --parallel=3 --label=harness-watch-macos-intel-${{ matrix.variant }}-${{ matrix.shard }}
  windows:
    name: stress windows-2022 ${{ matrix.variant }} ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore the tests as they were before the fix
        if: matrix.variant == 'before'
        shell: bash
        run: git checkout origin/dev -- plugin/bin/harness-watch.test.mjs plugin/bin/harness-background.test.mjs scripts/windows/windows-role-readlink.test.mjs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Calculate runtime cache identity
        id: runtime-key
        shell: pwsh
        run: |
          $key = node scripts/windows/windows-role-runtime-cache.mjs key
          "key=$key" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        id: node-cache
        with:
          path: ${{ runner.temp }}/stagekeeper-node-source/runtime
          key: ${{ steps.runtime-key.outputs.key }}
      - name: Prepare project dependencies with normal lifecycle scripts
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Generate policy contract types
        run: npm run db:generate
      - name: Repeat harness-background under load
        shell: pwsh
        env:
          STAGEKEEPER_RELEASED_READERS: required
        run: node .github/tmp/stress.mjs --file=plugin/bin/harness-background.test.mjs --rounds=7 --parallel=3 --label=harness-background-windows-${{ matrix.variant }}-${{ matrix.shard }}
      - name: Repeat readlink cleanup under load
        if: steps.node-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $env:STAGEKEEPER_TEST_WINDOWS_RUNTIME = "$env:RUNNER_TEMP/stagekeeper-node-source/runtime"
          node .github/tmp/stress.mjs --file=scripts/windows/windows-role-readlink.test.mjs --rounds=7 --parallel=3 --label=readlink-windows-${{ matrix.variant }}-${{ matrix.shard }}
  guard-race:
    name: guard race ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Take and release the same guard from four processes
        env:
          GUARD_RACE_SECONDS: "60"
          GUARD_RACE_WORKERS: "4"
        run: node .github/tmp/guard-race.mjs
