name: check

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # src/generated/prisma is gitignored, and tsc --noEmit needs the client types.
      - run: npm run db:generate
      - run: npm run check
      - run: npm test
      - run: npm run test:web
      # The production build catches what tsc --noEmit cannot: route collection,
      # server/client boundaries, static generation. No DATABASE_URL or .env is
      # provided: client generation and this build need no database connection.
      - run: npm run build
      # npm run test:templates stays local: plugin/templates/ is not in this
      # repository (origin Sangeok/harness-templates), so the runner has no files
      # to test.
