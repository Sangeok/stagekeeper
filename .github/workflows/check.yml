name: check

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  task-worktrees:
    name: task worktree tests (${{ matrix.os }}${{ matrix.shard && format(', {0}/4', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            shard: 1
          - os: windows-2022
            shard: 2
          - os: windows-2022
            shard: 3
          - os: windows-2022
            shard: 4
          - os: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Worktree usage runtime and probe contracts
        if: runner.os == 'macOS' || matrix.shard == 1
        run: npm exec --call "node --test scripts/pr/process-usage/process-usage.test.mjs scripts/pr/process-usage/process-usage-probe.test.mjs"
      - name: macOS native usage qualification
        if: runner.os == 'macOS'
        run: npm exec --call "node --test scripts/pr/process-usage/process-usage-qualification.test.mjs"
        env:
          STAGEKEEPER_USAGE_QUALIFICATION: "macos"
      - name: Windows directory observation counterexamples
        if: matrix.shard == 4
        run: npm exec --call "node --test scripts/pr/process-usage/windows-directory-usage.test.mjs"
        env:
          STAGEKEEPER_USAGE_NATIVE_REQUIRED: "1"
      - name: PR closeout lifecycle
        if: runner.os == 'macOS' || matrix.shard == 3
        run: npm exec --call "node --test scripts/pr/lifecycle.test.mjs"
      - name: PR merge contracts
        if: runner.os == 'macOS' || matrix.shard == 4
        run: npm exec --call "node --test scripts/pr/merge.test.mjs"
      - name: Conditional cleanup and native cache links
        if: runner.os == 'macOS' || matrix.shard == 2
        run: npm exec --call "node --test scripts/pr/cleanup.test.mjs"
      - name: PR state and recovery
        if: runner.os == 'macOS' || matrix.shard == 2
        run: npm exec --call "node --test scripts/pr/recovery.test.mjs"
      - name: Legacy migration and fence
        if: runner.os == 'macOS' || matrix.shard == 3
        run: npm exec --call "node --test scripts/pr/migration.test.mjs"
      - name: File and branch preservation
        if: runner.os == 'macOS' || matrix.shard == 4
        run: npm exec --call "node --test scripts/pr/preservation.test.mjs"
      - name: Merged task sweep
        if: runner.os == 'macOS' || matrix.shard == 1
        run: npm exec --call "node --test scripts/pr/sweep.test.mjs"
      - name: Retired writers and CLI boundary
        if: runner.os == 'macOS' || matrix.shard == 1
        run: npm exec --call "node --test scripts/pr/cli-integration.test.mjs"

  common:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: static
            label: static checks and tool tests
            command: npm run check
          - part: test
            label: package and plugin tests
            command: npm test
          - part: test-web
            label: web tests
            command: npm run test:web
          - part: server
            label: server tests
            command: npm run test:server
          - part: build
            label: build
            command: npm run build
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        if: matrix.part != 'build'
      - run: ${{ matrix.command }}
        env:
          STAGEKEEPER_RELEASED_READERS: required
      - name: Check fresh build manifests
        if: matrix.part == 'build'
        env:
          RDC_CHECK_ACTION_MANIFEST: "true"
          SRC_CHECK_INBOX_MANIFEST: "true"
          GITHUB_CHECK_ACTION_MANIFEST: "true"
        run: >-
          node --import ./tests/server/register-server-only.mjs --import tsx
          --test --test-name-pattern='\bfresh\b' "tests/server/*.test.ts"

  server-integration:
    name: server integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: stagekeeper
          POSTGRES_PASSWORD: stagekeeper
          POSTGRES_DB: stagekeeper_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stagekeeper -d stagekeeper_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://stagekeeper:stagekeeper@localhost:5432/stagekeeper_test_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:server:integration

  required:
    name: check (required)
    needs: [task-worktrees, common, server-integration]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job of this workflow passed
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const failed = Object.entries(needs).filter(([, job]) => job.result !== "success").map(([name, job]) => `${name}=${job.result}`);
            if (failed.length) {
              console.error(`not passed: ${failed.join(", ")}`);
              process.exit(1);
            }
            console.log(`passed: ${Object.keys(needs).join(", ")}`);
          '
