name: check

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts resolves env("DATABASE_URL") eagerly, so every prisma
      # command needs a value. Generating the client never opens a connection,
      # so this placeholder is enough and no secret belongs here.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # src/generated/prisma is gitignored, and tsc --noEmit needs the client types.
      - run: npm run db:generate
      - run: npm run check
      - run: npm test
      - run: npm run test:web
      # npm run test:templates stays local: plugin/templates/ is not in this
      # repository (origin Sangeok/harness-templates), so the runner has no files
      # to test.
