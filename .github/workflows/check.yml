name: check

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # src/generated/prisma is gitignored, and tsc --noEmit needs the client types.
      # The datasource has no url, so this needs no database and no secret.
      - run: npm run db:generate
      - run: npm run check
      - run: npm test
      - run: npm run test:web
      # npm run test:templates stays local: plugin/templates/ is not in this
      # repository (origin Sangeok/harness-templates), so the runner has no files
      # to test.
