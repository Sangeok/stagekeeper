name: macos-sandbox-identity-spike

on:
  push:
    branches: [harness/macos-sandbox-identity-spike-20261028]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: sandbox identity (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Probe per-run sandbox identity, survivor confinement and kill-until-quiescent
        run: node scripts/macos/probe-sandbox-identity.mjs "$RUNNER_TEMP/sandbox-identity.json"
      - name: Show evidence
        if: always()
        run: cat "$RUNNER_TEMP/sandbox-identity.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-identity-${{ matrix.runner }}
          path: ${{ runner.temp }}/sandbox-identity.json
          if-no-files-found: warn
