name: agent-eval

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      case:
        description: "Run only the cases whose name matches this glob (default: every case tagged gate)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: agent-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init-skill:
    name: init skill eval (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      summary_init_skill: ${{ steps.eval.outputs.summary_init_skill }}
    env:
      DISABLE_AUTOUPDATER: "1"
      EVAL_PLUGIN: /private/tmp/stagekeeper-eval/plugin
    steps:
      - name: Check that the eval token is available
        id: gate
        shell: bash
        env:
          EVAL_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: |
          if [ -z "$EVAL_TOKEN" ]; then
            echo "::notice::E2E_CLAUDE_OAUTH_TOKEN is not available to this run, so the agent eval is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Install Claude Code
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Copy the plugin and install the shell prefix
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf "$(dirname "$EVAL_PLUGIN")"
          mkdir -p "$(dirname "$EVAL_PLUGIN")" "$HOME/.local/bin"
          cp -R plugin "$EVAL_PLUGIN"
          cat > "$HOME/.local/bin/stagekeeper-eval-shell" <<'SH'
          #!/usr/bin/env bash
          export HARNESS_TOKEN=hu_evalFixtureOnlyNoNetwork0000000000000000000
          export HARNESS_SERVER=https://stagekeeper.invalid
          export HARNESS_TEMPLATES_DIR=.stagekeeper-eval/templates
          workspace="$HOME/cwd"
          [ -d "$workspace/.git" ] || workspace="$PWD"
          baseline="$workspace/.stagekeeper-eval/.baseline"
          [ -f "$baseline" ] && [ ! -e "$workspace/.eval-shell-active" ] && : > "$workspace/.eval-shell-active"
          if [ -f "$baseline" ]; then
            log="$workspace/.stagekeeper-eval/shell.log"
            [ -e "$log" ] || printf 'run %s\n' "${EVAL_CASE:-unknown}" > "$log"
            entry="$1"
            case "$entry" in
              *"eval '"*) entry="${entry#*"eval '"}"; entry="${entry%"' "*}" ;;
              *) [ "${#entry}" -le 300 ] || entry="${entry: -300}" ;;
            esac
            printf '%s\n' "$(printf '%s' "$entry" | tr '\n' ' ' | cut -c1-300)" >> "$log"
            generator='(^|[^[:alnum:]_./-])node[[:space:]]+([^[:space:]]+[[:space:]]+)*[^[:space:]]*harness-init\.mjs'
            if [[ "$1" =~ $generator ]]; then
              case "$1" in
                *--register*)
                  : > "$workspace/.eval-register-called"
                  origin="$(git -C "$workspace" remote get-url origin 2>/dev/null)"
                  repo="$(basename "$origin" .git)"
                  owner="$(basename "$(dirname "$origin")")"
                  printf '{"owner":"%s","repo":"%s","branch":"main","name":"%s","slug":"%s"}\n' "$owner" "$repo" "$repo" "$repo"
                  exit 0
                  ;;
                *--dry-run*|*--print-project*|*--help*|*--check*) ;;
                *) : > "$workspace/.eval-generate-called" ;;
              esac
            fi
          fi
          bash -c "$1"
          status=$?
          if [ -f "$baseline" ] && [ -n "$(find "$workspace/docs" "$workspace/.claude" "$workspace/CLAUDE.md" -newer "$baseline" -type f 2>/dev/null | head -n 1)" ]; then
            : > "$workspace/.eval-managed-write"
          fi
          exit "$status"
          SH
          chmod 755 "$HOME/.local/bin/stagekeeper-eval-shell"
      - name: Prove the detection with a control run
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: |
          CLAUDE_CODE_SHELL_PREFIX="$HOME/.local/bin/stagekeeper-eval-shell" claude plugin eval "$EVAL_PLUGIN" --case control-real-write --runs 1 --model claude-haiku-5-5 --trust-plugin --scaffold --allow-tools Bash --ablation none --no-publish --keep-temp --json "$RUNNER_TEMP/control.json" > "$RUNNER_TEMP/control-private.log" 2>&1 || true
          for kept in /private/tmp/e-*; do
            [ -d "$kept" ] || continue
            chmod -R u+rwx "$kept" 2>/dev/null || true
            rm -rf "$kept" || true
          done
          node scripts/rehearsals/agent-eval/agent-eval-summary.mjs --check-control "$RUNNER_TEMP/control.json"
      - name: Run the init skill eval
        id: eval
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
          CASE_GLOB: ${{ inputs.case }}
        run: |
          set +e
          selector=(--tag gate)
          if [ -n "$CASE_GLOB" ]; then
            [[ "$CASE_GLOB" =~ ^[a-z0-9*-]+$ ]] || { echo "::error::case must be a case name glob"; exit 2; }
            selector=(--case "$CASE_GLOB")
          fi
          CLAUDE_CODE_SHELL_PREFIX="$HOME/.local/bin/stagekeeper-eval-shell" claude plugin eval "$EVAL_PLUGIN" "${selector[@]}" --runs 3 -j 3 --model claude-opus-5-5 --trust-plugin --scaffold --allow-tools Bash --ablation none --no-publish --keep-temp --json "$RUNNER_TEMP/eval.json" > "$RUNNER_TEMP/eval-private.log" 2>&1
          code=$?
          node scripts/rehearsals/agent-eval/agent-eval-summary.mjs --result "$RUNNER_TEMP/eval.json" --control "$RUNNER_TEMP/control.json" --selection "${CASE_GLOB:-gate}" --exit-code "$code" --plugin "$EVAL_PLUGIN" --commit "$GITHUB_SHA" --summary "$RUNNER_TEMP/eval-summary.json" --client-version-output "$(claude --version 2>/dev/null)" --os-version "$(sw_vers -productVersion 2>/dev/null)" | tee "$RUNNER_TEMP/eval-lines.txt"
          summary_code=${PIPESTATUS[0]}
          { echo '```'; cat "$RUNNER_TEMP/eval-lines.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/eval-summary.json" ]; then echo "summary_init_skill=$(cat "$RUNNER_TEMP/eval-summary.json")" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          exit "$summary_code"
      - name: Remove private eval files
        if: always() && steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          for kept in /private/tmp/e-*; do
            [ -d "$kept" ] || continue
            chmod -R u+rwx "$kept" 2>/dev/null || true
            rm -rf "$kept"
          done
          rm -f "$RUNNER_TEMP/control-private.log" "$RUNNER_TEMP/eval-private.log" "$RUNNER_TEMP/control.json" "$RUNNER_TEMP/eval.json"
  record:
    name: record
    needs: [init-skill]
    if: ${{ always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/gate-record
        with:
          workflow: agent-eval
          result: ${{ needs.init-skill.result }}
          summaries: ${{ toJSON(needs.init-skill.outputs) }}
          legs: init_skill
