name: macos-runtime-contracts

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    paths:
      - scripts/rehearsals/smoke-server*
      - scripts/rehearsals/rehearse-client-init-smoke*
      - scripts/rehearsals/rehearse-pipeline-smoke*
      - scripts/rehearsals/rehearse-codex-macos*
      - .github/workflows/macos-runtime-contracts.yml
      - scripts/macos/**
      - scripts/build.mjs
      - next.config.*
      - prisma.config.ts
      - prisma/schema.prisma
      - src/app/layout.tsx
      - src/app/_fonts/**
      - packages/shared/**
      - packages/app-core/**
      - plugin/bin/**
      - plugin/runtime/**
      - plugin/lib/**
      - scripts/windows/package-windows-plugin.mjs
      - scripts/windows/package-windows-plugin.test.mjs
      - scripts/macos/package-plugin.mjs
      - scripts/macos/package-plugin.test.mjs
      - src/server/tokens/api.ts
      - scripts/checks/verify-ci-coverage.test.mjs
      - scripts/rehearsals/rehearse-shared-distribution.mjs
      - scripts/rehearsals/shared-distribution-contract.mjs
      - scripts/rehearsals/shared-distribution-contract.test.mjs
      - scripts/rehearsals/shared-template-snapshot.mjs
      - scripts/rehearsals/rehearse-client-init-smoke.ts
      - .github/actions/smoke-database/**
      - src/server/**
      - src/app/api/**
      - prisma/**
      - scripts/plugin-lib.mjs
      - scripts/plugin-lib.test.mjs
      - scripts/lib/shared-module-graph.mjs
      - scripts/lib/shared-module-graph.test.mjs
      - scripts/lib/testing/shared-module-fixture.mjs
      - scripts/lib/testing/plugin-package-fixture.mjs
      - scripts/lib/plugin-payload.mjs
      - scripts/checks/verify-shared-boundaries.mjs
      - scripts/checks/verify-shared-boundaries.test.mjs
      - src/server/pipeline/qa-report.ts
      - src/server/pipeline/qa-report.test.ts
      - src/server/pipeline/input-validation.ts
      - src/server/pipeline/input-validation.test.ts
      - src/server/projects/availability-policy.ts
      - src/server/projects/availability-policy.test.ts
      - src/server/usage/usage-window.ts
      - src/server/usage/usage-window.test.ts
      - src/server/tokens/token-crypto.ts
      - src/server/tokens/token-crypto.test.ts
      - src/server/templates/release-preparation.ts
      - src/server/templates/release-preparation.test.ts
      - src/server/templates/runbook-query.ts
      - src/server/templates/api.ts
      - src/fsd/entities/board-item/model/doc-link.ts
      - src/fsd/entities/board-item/model/doc-link.test.ts
      - tests/server/runbook-stale.test.ts
      - plugin/.claude-plugin/plugin.json
      - plugin/.codex-plugin/plugin.json
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: runtime contracts (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Probe native permissions and detached-child containment
        run: node scripts/macos/probe-seatbelt-containment.mjs "$RUNNER_TEMP/seatbelt-containment.json"
      - name: Probe recursive tracking and orphan ownership
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/macos/probe-descendant-ownership.mjs "$RUNNER_TEMP/descendant-ownership.json"
      - name: Probe launchd lifecycle and detached descendants
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/macos/probe-launchd-ownership.mjs "$RUNNER_TEMP/launchd-ownership.json"
      - name: Probe ordinary-user coalition control
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/macos/probe-coalition-access.mjs "$RUNNER_TEMP/coalition-access.json"
      - name: Probe per-run sandbox identity, survivor confinement and quiescence
        run: node scripts/macos/probe-sandbox-identity.mjs "$RUNNER_TEMP/sandbox-identity.json"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: coalition-access-${{ matrix.runner }}
          path: ${{ runner.temp }}/coalition-access.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-identity-${{ matrix.runner }}
          path: ${{ runner.temp }}/sandbox-identity.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seatbelt-containment-${{ matrix.runner }}
          path: ${{ runner.temp }}/seatbelt-containment.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: descendant-ownership-${{ matrix.runner }}
          path: ${{ runner.temp }}/descendant-ownership.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: launchd-ownership-${{ matrix.runner }}
          path: ${{ runner.temp }}/launchd-ownership.json
          if-no-files-found: warn
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - name: Validate migrated policy contracts
        run: npm run test:policy-contracts
      - name: Validate shared distribution contracts
        run: node --test scripts/plugin-lib.test.mjs scripts/lib/shared-module-graph.test.mjs scripts/checks/verify-shared-boundaries.test.mjs scripts/macos/package-plugin.test.mjs scripts/windows/package-windows-plugin.test.mjs
      - name: Validate owned smoke server lifecycle
        run: node --test scripts/rehearsals/smoke-server.test.mjs
      - name: Build the verified native macOS runtime
        shell: bash
        run: |
          architecture="$(node -p process.arch)"
          archive="$RUNNER_TEMP/node-v22.23.3-darwin-$architecture.tar.gz"
          curl -fsSL "https://nodejs.org/dist/v22.23.3/node-v22.23.3-darwin-$architecture.tar.gz" -o "$archive"
          node scripts/macos/build-runtime.mjs --archive "$archive" --output "$GITHUB_WORKSPACE/plugin/runtime/macos/node"
      - name: Record contract-test environment
        run: node -e 'console.log(JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,scope:"model-free runtime contracts"}))'
      - name: Validate shared runtime contracts without client credentials
        env:
          STAGEKEEPER_MACOS_RUNTIME_REQUIRED: "1"
          STAGEKEEPER_RELEASED_READERS: required
        run: node --test --test-concurrency=1 "packages/shared/**/*.test.mjs" "packages/app-core/**/*.test.mjs" "plugin/bin/*.test.mjs" "plugin/runtime/**/*.test.mjs"
      - name: Build the complete project inside the offline native role
        run: >-
          node scripts/macos/rehearse-project-build.mjs
          --root "$GITHUB_WORKSPACE" --runtime "$GITHUB_WORKSPACE/plugin/runtime/macos/node"
          --evidence "$RUNNER_TEMP/native-project-build.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-project-build-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-project-build.json
          if-no-files-found: warn
      - name: Check shared acceptance inputs
        id: shared-inputs
        shell: bash
        env:
          TEMPLATES_TOKEN: ${{ secrets.E2E_TEMPLATES_TOKEN }}
          TRUSTED_HEAD: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$TRUSTED_HEAD" = "true" ] && [ -n "$TEMPLATES_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Shared native acceptance is BLOCKED: trusted template access is unavailable"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out pinned shared acceptance templates
        if: steps.shared-inputs.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          repository: Sangeok/harness-templates
          ref: 8ccb37a4ab91de527e6a23caa6d415c7cdc6f215
          token: ${{ secrets.E2E_TEMPLATES_TOKEN }}
          path: plugin/templates
          persist-credentials: false
      - name: Prepare shared acceptance database
        if: steps.shared-inputs.outputs.ready == 'true'
        uses: ./.github/actions/smoke-database
        with:
          pg-package: ${{ matrix.runner == 'macos-15' && 'darwin-arm64' || 'darwin-x64' }}
          port: '45432'
          database: stagekeeper_test_shared_distribution
      - name: Prepare previous and candidate server builds
        if: steps.shared-inputs.outputs.ready == 'true'
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:45432/stagekeeper_test_shared_distribution
        run: |
          set -e
          git worktree add --detach "$RUNNER_TEMP/shared-previous" 85c66fb1d9e02c3d9416710240cbfca3f0023939
          npm --prefix "$RUNNER_TEMP/shared-previous" ci --no-audit --no-fund
          npm --prefix "$RUNNER_TEMP/shared-previous" run build
          npm run build
          node -e 'require("node:fs").renameSync("plugin/templates", require("node:path").join(process.env.RUNNER_TEMP,"shared-templates"))'
      - name: Validate shared distribution acceptance
        if: steps.shared-inputs.outputs.ready == 'true'
        shell: pwsh
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:45432/stagekeeper_test_shared_distribution
          SMB_NATIVE_RUNTIME: ${{ github.workspace }}/plugin/runtime/macos/node
        run: |
          node --import ./tests/server/register-server-only.mjs --import tsx scripts/rehearsals/rehearse-shared-distribution.mjs --runtime $env:SMB_NATIVE_RUNTIME --templates (Join-Path $env:RUNNER_TEMP 'shared-templates') --previous (Join-Path $env:RUNNER_TEMP 'shared-previous') --evidence (Join-Path $env:RUNNER_TEMP 'shared-distribution-acceptance')
          if ($LASTEXITCODE -ne 0) { throw 'Shared distribution acceptance failed' }
      - name: Stop shared acceptance database
        if: always() && steps.shared-inputs.outputs.ready == 'true'
        shell: bash
        env:
          SMB_PG_PACKAGE: ${{ matrix.runner == 'macos-15' && 'darwin-arm64' || 'darwin-x64' }}
        run: |
          if [ -f "$RUNNER_TEMP/pgdata/postmaster.pid" ]; then
            executable="$RUNNER_TEMP/pg/node_modules/@embedded-postgres/$SMB_PG_PACKAGE/native/bin/pg_ctl"
            if [ "$RUNNER_OS" = "Windows" ]; then executable="$executable.exe"; fi
            "$executable" -D "$RUNNER_TEMP/pgdata" -m fast -w stop
          fi
      - name: Preserve shared acceptance summary
        if: always() && steps.shared-inputs.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shared-distribution-${{ matrix.runner }}
          path: ${{ runner.temp }}/shared-distribution-acceptance/summary.json
          if-no-files-found: error
          retention-days: 14
