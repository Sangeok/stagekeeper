name: macos-runtime-contracts

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/macos-runtime-contracts.yml
      - scripts/macos/**
      - scripts/build.mjs
      - next.config.*
      - prisma.config.ts
      - prisma/schema.prisma
      - src/app/layout.tsx
      - src/app/_fonts/**
      - packages/core/**
      - packages/github/**
      - plugin/bin/**
      - plugin/runtime/**
      - plugin/lib/**
      - plugin/.claude-plugin/plugin.json
      - plugin/.codex-plugin/plugin.json
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: runtime contracts (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Probe native permissions and detached-child containment
        run: node scripts/macos/probe-seatbelt-containment.mjs "$RUNNER_TEMP/seatbelt-containment.json"
      - name: Probe recursive tracking and orphan ownership
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/macos/probe-descendant-ownership.mjs "$RUNNER_TEMP/descendant-ownership.json"
      - name: Probe launchd lifecycle and detached descendants
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/macos/probe-launchd-ownership.mjs "$RUNNER_TEMP/launchd-ownership.json"
      - name: Probe ordinary-user coalition control
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/macos/probe-coalition-access.mjs "$RUNNER_TEMP/coalition-access.json"
      - name: Probe per-run sandbox identity, survivor confinement and quiescence
        run: node scripts/macos/probe-sandbox-identity.mjs "$RUNNER_TEMP/sandbox-identity.json"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: coalition-access-${{ matrix.runner }}
          path: ${{ runner.temp }}/coalition-access.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-identity-${{ matrix.runner }}
          path: ${{ runner.temp }}/sandbox-identity.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seatbelt-containment-${{ matrix.runner }}
          path: ${{ runner.temp }}/seatbelt-containment.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: descendant-ownership-${{ matrix.runner }}
          path: ${{ runner.temp }}/descendant-ownership.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: launchd-ownership-${{ matrix.runner }}
          path: ${{ runner.temp }}/launchd-ownership.json
          if-no-files-found: warn
      - run: npm ci --no-audit --no-fund
      - name: Build the verified native macOS runtime
        shell: bash
        run: |
          architecture="$(node -p process.arch)"
          archive="$RUNNER_TEMP/node-v22.23.3-darwin-$architecture.tar.gz"
          curl -fsSL "https://nodejs.org/dist/v22.23.3/node-v22.23.3-darwin-$architecture.tar.gz" -o "$archive"
          node scripts/macos/build-runtime.mjs --archive "$archive" --output "$GITHUB_WORKSPACE/plugin/runtime/macos/node"
      - name: Record contract-test environment
        run: node -e 'console.log(JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,scope:"model-free runtime contracts"}))'
      - name: Validate shared runtime contracts without client credentials
        env:
          STAGEKEEPER_MACOS_RUNTIME_REQUIRED: "1"
          STAGEKEEPER_RELEASED_READERS: required
        run: node --test --test-concurrency=1 "packages/core/**/*.test.mjs" "packages/github/**/*.test.mjs" "plugin/bin/*.test.mjs" "plugin/runtime/*.test.mjs"
      - name: Build the complete project inside the offline native role
        run: >-
          node scripts/macos/rehearse-project-build.mjs
          --root "$GITHUB_WORKSPACE" --runtime "$GITHUB_WORKSPACE/plugin/runtime/macos/node"
          --evidence "$RUNNER_TEMP/native-project-build.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-project-build-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-project-build.json
          if-no-files-found: warn
