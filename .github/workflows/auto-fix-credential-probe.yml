name: auto-fix-credential-probe

on:
  push:
    branches:
      - harness/auto-fix-agent-trial
    paths:
      - .github/auto-fix-agent-trial/probe/run.json

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ matrix.os }} ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        variant: [scrub, sandbox-local]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/auto-fix-agent-trial/probe
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the sandbox dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get install -y -qq bubblewrap socat >/dev/null
      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Claude Code (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Put the probe in a directory outside the checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/probe-work"
          cp .github/auto-fix-agent-trial/probe/probe.sh .github/auto-fix-agent-trial/probe/probe.mjs "$RUNNER_TEMP/probe-work/"
          git -C "$RUNNER_TEMP/probe-work" init --quiet
      - name: Run the probe through the Bash tool
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        working-directory: ${{ runner.temp }}/probe-work
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ matrix.variant != 'baseline' && '1' || '' }}
          PROBE_CANARY_SECRET: not-a-real-secret-value
          PROBE_PLAIN: plain-value
          PROBE_OUTSIDE: ${{ github.workspace }}
          VARIANT: ${{ matrix.variant }}
        run: |
          claude --version
          case "$VARIANT" in
            sandbox) settings='{"sandbox":{"enabled":true,"allowUnsandboxedCommands":false,"network":{"allowedDomains":["api.anthropic.com"]}}}' ;;
            sandbox-local) settings='{"sandbox":{"enabled":true,"allowUnsandboxedCommands":false,"network":{"allowedDomains":["api.anthropic.com"],"allowLocalBinding":true}}}' ;;
            *) settings='{}' ;;
          esac
          echo 'Run this exact command once with the Bash tool and nothing else: bash probe.sh' > "$RUNNER_TEMP/prompt.txt"
          echo 'After it finishes, reply with the single word done.' >> "$RUNNER_TEMP/prompt.txt"
          claude --print --model claude-haiku-5-5 --permission-mode dontAsk --allowedTools Bash Read Edit Write Glob Grep --settings "$settings" --disallowedTools WebFetch WebSearch --output-format stream-json --verbose --no-session-persistence < "$RUNNER_TEMP/prompt.txt" > "$RUNNER_TEMP/transcript.jsonl"
      - name: Show the result without the token
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}/probe-work
        env:
          TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: |
          if [ ! -f probe-result.txt ]; then echo "PROBE no-result-file"; node -e 'const fs=require("fs");const p=process.argv[1];if(!fs.existsSync(p))process.exit(0);for(const l of fs.readFileSync(p,"utf8").split("\n")){try{const e=JSON.parse(l);if(e.type==="result")console.log("PROBE result",e.subtype,String(e.result).slice(0,200).replace(/\n/g," "));if(e.type==="system"&&e.subtype==="init")console.log("PROBE init",e.model,e.permissionMode)}catch{}}' "$RUNNER_TEMP/transcript.jsonl"; exit 0; fi
          if grep -qF "$TOKEN" probe-result.txt; then echo "PROBE the token is in the result; nothing is shown"; exit 1; fi
          sed 's/^/PROBE /' probe-result.txt
