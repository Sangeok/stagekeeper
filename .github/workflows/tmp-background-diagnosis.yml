name: tmp-background-diagnosis

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  background:
    name: evidence windows-2022 x${{ matrix.parallel }} ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        parallel: [2, 3]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare project dependencies with normal lifecycle scripts
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Generate policy contract types
        run: npm run db:generate
      - name: Repeat harness-background and keep the evidence of each failure
        shell: pwsh
        env:
          STAGEKEEPER_RELEASED_READERS: required
        run: node .github/tmp/stress.mjs --file=plugin/bin/harness-background.test.mjs --rounds=10 --parallel=${{ matrix.parallel }} --label=evidence-x${{ matrix.parallel }}-${{ matrix.shard }}
