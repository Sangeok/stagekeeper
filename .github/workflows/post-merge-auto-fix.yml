name: post-merge-auto-fix

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the issue that receives the attempt record
        required: true
        type: string
      runner:
        description: Runner of the failed job, used for the reproduction, the agent and the measurement
        required: true
        type: choice
        options: [windows-2022, macos-15, macos-15-intel, ubuntu-latest]
      workflow:
        description: Workflow to call once on the fix branch
        required: true
        type: choice
        options: [windows-role-runtime, macos-runtime-contracts, none]
      source:
        description: Where the change comes from. reproduce-only repeats the failing test, records what it saw and asks for no change
        required: true
        type: choice
        default: prepared
        options: [prepared, agent, reproduce-only]
      prepared:
        description: For a prepared change, its name under .github/actions/post-merge-auto-fix/prepared
        required: false
        type: string
      model:
        description: For an agent, the model
        required: false
        type: choice
        default: claude-sonnet-5-5
        options: [claude-sonnet-5-5, claude-opus-5-5]
      runs:
        description: For an agent or reproduce-only, the failed run numbers whose logs name the failing test, separated by commas
        required: false
        type: string
      job:
        description: For an agent or reproduce-only, the name of the failed job in those runs
        required: false
        type: string
      reproduction:
        description: For an agent. skip calls it without reproducing the failure first and marks the result as not reproduced
        required: false
        type: choice
        default: required
        options: [required, skip]
      commit:
        description: Practice only. A full commit id to work on instead of dev. Opens no pull request and calls no full check
        required: false
        type: string
      open_pr:
        description: Open a pull request when the checks allow it
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: post-merge-auto-fix-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue: ${{ steps.plan.outputs.issue }}
      runner: ${{ steps.plan.outputs.runner }}
      workflow: ${{ steps.plan.outputs.workflow }}
      open_pr: ${{ steps.plan.outputs.open_pr }}
      branch: ${{ steps.plan.outputs.branch }}
      source: ${{ steps.plan.outputs.source }}
      prepared: ${{ steps.plan.outputs.prepared }}
      model: ${{ steps.plan.outputs.model }}
      runs: ${{ steps.plan.outputs.runs }}
      job: ${{ steps.plan.outputs.job }}
      rehearsal: ${{ steps.plan.outputs.rehearsal }}
      reproduction: ${{ steps.plan.outputs.reproduction }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/post-merge-auto-fix
      - name: Read the request
        id: plan
        shell: bash
        env:
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_RUNNER: ${{ inputs.runner }}
          INPUT_WORKFLOW: ${{ inputs.workflow }}
          INPUT_PREPARED: ${{ inputs.prepared }}
          INPUT_OPEN_PR: ${{ inputs.open_pr }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_REPRODUCTION: ${{ inputs.reproduction }}
          INPUT_RUNS: ${{ inputs.runs }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          dev="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/dev | cut -f1)"
          test -n "$dev"
          node .github/actions/post-merge-auto-fix/fix.mjs plan --run "$GITHUB_RUN_ID" --dev "$dev"

  reproduce:
    needs: [plan]
    if: needs.plan.outputs.source != 'prepared'
    name: reproduce ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, macos-15-intel, ubuntu-latest]
    steps:
      - name: Run only on the runner of the failed job
        id: gate
        shell: bash
        env:
          WANTED: ${{ needs.plan.outputs.runner }}
          THIS: ${{ matrix.runner }}
        run: echo "run=$([ "$WANTED" = "$THIS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Check out the code without a remote
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          git init --quiet .
          git fetch --quiet --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$BASE"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BASE"
          echo ".auto-fix-tools/" >> .git/info/exclude
      - name: Check out the workflow's own tools beside the code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          path: .auto-fix-tools
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - name: Download the logs of the failed job
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.plan.outputs.runs }}
          JOB: ${{ needs.plan.outputs.job }}
        run: node .auto-fix-tools/.github/actions/post-merge-auto-fix/fix.mjs logs --repository "$GITHUB_REPOSITORY" --runs "$RUNS" --job "$JOB" --out "$RUNNER_TEMP/auto-fix-input"
      - name: Prepare project dependencies
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run db:generate
      - name: Prepare the Windows role runtime
        if: steps.gate.outputs.run == 'true' && runner.os == 'Windows'
        uses: ./.auto-fix-tools/.github/actions/setup-windows-role-runtime
        with:
          build-on-miss: "false"
      - name: Prepare the macOS runtime
        if: steps.gate.outputs.run == 'true' && runner.os == 'macOS'
        uses: ./.auto-fix-tools/.github/actions/setup-macos-runtime
      - name: Repeat the test file named in the logs, without load first
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          RUNNER_NAME: ${{ matrix.runner }}
          SKIP: ${{ needs.plan.outputs.reproduction == 'skip' }}
        run: node .auto-fix-tools/.github/actions/post-merge-auto-fix/fix.mjs reproduce --logs "$RUNNER_TEMP/auto-fix-input" --cwd "$GITHUB_WORKSPACE" --runner "$RUNNER_NAME" --skip "$SKIP" --minutes 45 --out "$RUNNER_TEMP/auto-fix-reproduction"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: auto-fix-reproduction
          path: ${{ runner.temp }}/auto-fix-reproduction
          retention-days: 7
          if-no-files-found: error

  reproduction:
    needs: [plan, reproduce]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.source != 'prepared' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.read.outputs.kind }}
      proceed: ${{ steps.read.outputs.proceed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/post-merge-auto-fix
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: auto-fix-reproduction
          path: ${{ runner.temp }}/auto-fix-reproduction
      - name: Read what the reproduction found
        id: read
        shell: bash
        run: node .github/actions/post-merge-auto-fix/fix.mjs reproduction --dir "$RUNNER_TEMP/auto-fix-reproduction"

  fix:
    needs: [plan, reproduction]
    if: ${{ !cancelled() && needs.plan.outputs.source == 'agent' && needs.reproduction.outputs.proceed == 'true' }}
    name: fix ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, macos-15-intel, ubuntu-latest]
    steps:
      - name: Run only on the runner of the failed job
        id: gate
        shell: bash
        env:
          WANTED: ${{ needs.plan.outputs.runner }}
          THIS: ${{ matrix.runner }}
        run: echo "run=$([ "$WANTED" = "$THIS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Check out the code without history after it and without a remote
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          git init --quiet .
          git fetch --quiet --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$BASE"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git remote)"
          echo ".auto-fix-tools/" >> .git/info/exclude
      - name: Check out the workflow's own tools beside the code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          path: .auto-fix-tools
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - name: Download the logs of the failed job
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.plan.outputs.runs }}
          JOB: ${{ needs.plan.outputs.job }}
        run: node .auto-fix-tools/.github/actions/post-merge-auto-fix/fix.mjs logs --repository "$GITHUB_REPOSITORY" --runs "$RUNS" --job "$JOB" --out "$RUNNER_TEMP/auto-fix-input"
      - name: Prepare project dependencies
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run db:generate
      - name: Prepare the Windows role runtime
        if: steps.gate.outputs.run == 'true' && runner.os == 'Windows'
        uses: ./.auto-fix-tools/.github/actions/setup-windows-role-runtime
        with:
          build-on-miss: "false"
      - name: Prepare the macOS runtime
        if: steps.gate.outputs.run == 'true' && runner.os == 'macOS'
        uses: ./.auto-fix-tools/.github/actions/setup-macos-runtime
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: auto-fix-reproduction
          path: ${{ runner.temp }}/auto-fix-reproduction
      - name: Install Claude Code (Windows)
        if: steps.gate.outputs.run == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Claude Code (macOS and Linux)
        if: steps.gate.outputs.run == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Write the prompt and record the state before the agent
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          WORKFLOW: ${{ needs.plan.outputs.workflow }}
          JOB: ${{ needs.plan.outputs.job }}
        run: |
          mkdir -p "$RUNNER_TEMP/auto-fix-agent"
          node .auto-fix-tools/.github/actions/post-merge-auto-fix/fix.mjs prompt --workflow "$WORKFLOW" --job "$JOB" --logs "$RUNNER_TEMP/auto-fix-input" --reproduction "$RUNNER_TEMP/auto-fix-reproduction" --notes "$RUNNER_TEMP/auto-fix-agent/notes.md" --out "$RUNNER_TEMP/auto-fix-input/prompt.md"
          git add -A
          git write-tree > "$RUNNER_TEMP/auto-fix-input/base-tree"
          git reset --quiet
      - name: Run the agent
        id: agent
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          MODEL: ${{ needs.plan.outputs.model }}
        run: |
          claude --version
          date +%s > "$RUNNER_TEMP/auto-fix-input/started"
          claude --print --model "$MODEL" --effort medium --permission-mode dontAsk --allowedTools Bash Read Edit Write Glob Grep --disallowedTools WebFetch WebSearch --output-format stream-json --verbose --no-session-persistence < "$RUNNER_TEMP/auto-fix-input/prompt.md" > "$RUNNER_TEMP/auto-fix-agent/transcript.jsonl"
      - name: Collect the output and stop when a secret is in it
        id: collect
        if: always() && steps.gate.outputs.run == 'true' && steps.agent.outcome != 'skipped'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
          TRANSCRIPT_KEY: ${{ secrets.E2E_TRANSCRIPT_KEY }}
          MODEL: ${{ needs.plan.outputs.model }}
        run: |
          seconds="$(( $(date +%s) - $(cat "$RUNNER_TEMP/auto-fix-input/started") ))"
          node .auto-fix-tools/.github/actions/post-merge-auto-fix/fix.mjs collect --cwd "$GITHUB_WORKSPACE" --base "$(cat "$RUNNER_TEMP/auto-fix-input/base-tree")" --transcript "$RUNNER_TEMP/auto-fix-agent/transcript.jsonl" --notes "$RUNNER_TEMP/auto-fix-agent/notes.md" --seconds "$seconds" --model "$MODEL" --out "$RUNNER_TEMP/auto-fix-output"
      - uses: actions/upload-artifact@v4
        if: always() && steps.collect.outcome == 'success'
        with:
          name: auto-fix-agent-output
          path: ${{ runner.temp }}/auto-fix-output
          retention-days: 7
          if-no-files-found: error

  change:
    needs: [plan, reproduction, fix]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.source == 'prepared' || (needs.plan.outputs.source == 'agent' && needs.reproduction.outputs.proceed == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      change: ${{ steps.change.outputs.change }}
      refused: ${{ steps.change.outputs.refused }}
      source: ${{ steps.change.outputs.source }}
      patch_sha: ${{ steps.change.outputs.patch_sha }}
      plan_sha: ${{ steps.change.outputs.plan_sha }}
      runners: ${{ steps.change.outputs.runners }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/post-merge-auto-fix
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.source == 'agent'
        continue-on-error: true
        with:
          name: auto-fix-agent-output
          path: ${{ runner.temp }}/auto-fix-agent
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.source == 'agent'
        with:
          name: auto-fix-reproduction
          path: ${{ runner.temp }}/auto-fix-reproduction
      - name: Check the change and publish its digests
        id: change
        shell: bash
        env:
          SOURCE: ${{ needs.plan.outputs.source }}
          PREPARED: ${{ needs.plan.outputs.prepared }}
          MODEL: ${{ needs.plan.outputs.model }}
        run: node .github/actions/post-merge-auto-fix/fix.mjs change --source "$SOURCE" --prepared "$PREPARED" --model "$MODEL" --agent "$RUNNER_TEMP/auto-fix-agent" --reproduction "$RUNNER_TEMP/auto-fix-reproduction" --out "$RUNNER_TEMP/auto-fix"
      - uses: actions/upload-artifact@v4
        if: steps.change.outputs.change == 'ready'
        with:
          name: auto-fix-change
          path: ${{ runner.temp }}/auto-fix
          retention-days: 7
          if-no-files-found: error

  measure:
    needs: [plan, change]
    if: ${{ !cancelled() && needs.change.outputs.change == 'ready' && needs.change.outputs.refused == 'false' }}
    name: measure ${{ matrix.runner }} ${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, macos-15-intel, ubuntu-latest]
        shard: [1, 2, 3]
    steps:
      - name: Run only on the runner of the failed job, on as many runners as the kind of failure needs
        id: gate
        shell: bash
        env:
          WANTED: ${{ needs.plan.outputs.runner }}
          THIS: ${{ matrix.runner }}
          SHARD: ${{ matrix.shard }}
          RUNNERS: ${{ needs.change.outputs.runners }}
        run: echo "run=$([ "$WANTED" = "$THIS" ] && [ "$SHARD" -le "${RUNNERS:-3}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ needs.plan.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the workflow's own tools beside the code under test
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          path: .auto-fix-tools
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: auto-fix-change
          path: ${{ runner.temp }}/auto-fix
      - name: Prepare project dependencies
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run db:generate
      - name: Prepare the Windows role runtime
        if: steps.gate.outputs.run == 'true' && runner.os == 'Windows'
        uses: ./.auto-fix-tools/.github/actions/setup-windows-role-runtime
        with:
          build-on-miss: "false"
      - name: Prepare the macOS runtime
        if: steps.gate.outputs.run == 'true' && runner.os == 'macOS'
        uses: ./.auto-fix-tools/.github/actions/setup-macos-runtime
      - name: Repeat the test file before and after the change in turn
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          RUNNER_NAME: ${{ matrix.runner }}
          PATCH_SHA: ${{ needs.change.outputs.patch_sha }}
          PLAN_SHA: ${{ needs.change.outputs.plan_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/auto-fix-result"
          node .auto-fix-tools/.github/actions/post-merge-auto-fix/fix.mjs measure --change "$RUNNER_TEMP/auto-fix" --patch-sha "$PATCH_SHA" --plan-sha "$PLAN_SHA" --cwd "$GITHUB_WORKSPACE" --runner "$RUNNER_NAME" --minutes 45 --out "$RUNNER_TEMP/auto-fix-result/result.json"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: auto-fix-measure-${{ matrix.runner }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/auto-fix-result
          retention-days: 7
          if-no-files-found: error

  branch:
    needs: [plan, change, measure]
    if: ${{ !cancelled() && needs.change.outputs.change == 'ready' && needs.change.outputs.refused == 'false' && needs.measure.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    outputs:
      open: ${{ steps.decide.outputs.open }}
      verdict: ${{ steps.decide.outputs.verdict }}
      labels: ${{ steps.decide.outputs.labels }}
      required: ${{ steps.decide.outputs.required }}
      compared: ${{ steps.decide.outputs.compared }}
      before: ${{ steps.decide.outputs.before }}
      after: ${{ steps.decide.outputs.after }}
      remaining: ${{ steps.decide.outputs.remaining }}
      missing: ${{ steps.decide.outputs.missing }}
      pushed: ${{ steps.push.outputs.pushed }}
      duplicate: ${{ steps.duplicate.outputs.pr }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.base }}
      - name: Check out the workflow's own tools beside the code under test
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/post-merge-auto-fix
          path: .auto-fix-tools
      - uses: actions/download-artifact@v4
        with:
          name: auto-fix-change
          path: ${{ runner.temp }}/auto-fix
      - uses: actions/download-artifact@v4
        with:
          pattern: auto-fix-measure-*
          path: ${{ runner.temp }}/auto-fix-results
      - name: Decide from the measured counts
        id: decide
        shell: bash
        env:
          PATCH_SHA: ${{ needs.change.outputs.patch_sha }}
          PLAN_SHA: ${{ needs.change.outputs.plan_sha }}
        run: node .auto-fix-tools/.github/actions/post-merge-auto-fix/fix.mjs decide --change "$RUNNER_TEMP/auto-fix" --patch-sha "$PATCH_SHA" --plan-sha "$PLAN_SHA" --results "$RUNNER_TEMP/auto-fix-results"
      - name: Find an open pull request that carries the same change
        id: duplicate
        if: steps.decide.outputs.open == 'true' && needs.plan.outputs.rehearsal != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          own="$(git patch-id --stable < "$RUNNER_TEMP/auto-fix/change.patch" | cut -d' ' -f1)"
          for number in $(gh pr list --state open --base dev --author 'app/github-actions' --json number,headRefName --jq '.[] | select(.headRefName | startswith("harness/auto-fix-")) | .number'); do
            other="$(gh pr diff "$number" | git patch-id --stable | cut -d' ' -f1)"
            if [ -n "$own" ] && [ "$own" = "$other" ]; then echo "pr=$number" >> "$GITHUB_OUTPUT"; break; fi
          done
      - name: Push the change as a fix branch
        id: push
        if: steps.decide.outputs.open == 'true' && steps.duplicate.outputs.pr == '' && needs.plan.outputs.rehearsal != 'true'
        shell: bash
        env:
          BRANCH: ${{ needs.plan.outputs.branch }}
          ISSUE: ${{ needs.plan.outputs.issue }}
        run: |
          git apply --index "$RUNNER_TEMP/auto-fix/change.patch"
          if git diff --cached --name-only | grep -E '^(\.github/|AGENTS\.md$|CLAUDE\.md$|vercel\.json$|vercel\.ts$)'; then
            echo "::error::the change touches a path that an automatic fix must not change"
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet --message "fix: apply the automatic fix change for #$ISSUE"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  full-windows:
    needs: [plan, branch]
    if: ${{ !cancelled() && needs.branch.outputs.pushed == 'true' && needs.plan.outputs.workflow == 'windows-role-runtime' }}
    uses: ./.github/workflows/windows-role-runtime.yml
    with:
      ref: ${{ needs.plan.outputs.branch }}

  full-macos:
    needs: [plan, branch]
    if: ${{ !cancelled() && needs.branch.outputs.pushed == 'true' && needs.plan.outputs.workflow == 'macos-runtime-contracts' }}
    uses: ./.github/workflows/macos-runtime-contracts.yml
    with:
      ref: ${{ needs.plan.outputs.branch }}

  pull-request:
    needs: [plan, change, branch, full-windows, full-macos]
    if: ${{ always() && needs.branch.outputs.pushed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      number: ${{ steps.open.outputs.number }}
      full_check: ${{ steps.full.outputs.result }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/post-merge-auto-fix
      - uses: actions/download-artifact@v4
        with:
          name: auto-fix-change
          path: ${{ runner.temp }}/auto-fix
      - name: Read the result of the full check
        id: full
        shell: bash
        env:
          WORKFLOW: ${{ needs.plan.outputs.workflow }}
          WINDOWS: ${{ needs.full-windows.result }}
          MACOS: ${{ needs.full-macos.result }}
        run: |
          case "$WORKFLOW" in
            none) result=not-run ;;
            windows-role-runtime) [ "$WINDOWS" = success ] && result=passed || result=failed ;;
            macos-runtime-contracts) [ "$MACOS" = success ] && result=passed || result=failed ;;
            *) result=failed ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Open the pull request
        id: open
        if: needs.plan.outputs.open_pr == 'true' && steps.full.outputs.result != 'failed'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          ISSUE: ${{ needs.plan.outputs.issue }}
          SOURCE: ${{ needs.change.outputs.source }}
          WORKFLOW: ${{ needs.plan.outputs.workflow }}
          PATCH_SHA: ${{ needs.change.outputs.patch_sha }}
          PLAN_SHA: ${{ needs.change.outputs.plan_sha }}
          VERDICT: ${{ needs.branch.outputs.verdict }}
          REQUIRED: ${{ needs.branch.outputs.required }}
          COMPARED: ${{ needs.branch.outputs.compared }}
          BEFORE: ${{ needs.branch.outputs.before }}
          AFTER: ${{ needs.branch.outputs.after }}
          LABELS: ${{ needs.branch.outputs.labels }}
          FULL: ${{ steps.full.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="$(node .github/actions/post-merge-auto-fix/fix.mjs body --change "$RUNNER_TEMP/auto-fix" --patch-sha "$PATCH_SHA" --plan-sha "$PLAN_SHA" --issue "$ISSUE" --source "$SOURCE" --workflow "$WORKFLOW" --verdict "$VERDICT" --open true --required "$REQUIRED" --compared "$COMPARED" --before "$BEFORE" --after "$AFTER" --full-check "$FULL" --run-url "$RUN_URL" --out "$RUNNER_TEMP/body.md" | sed -n 's/^title=//p')"
          test -n "$title"
          arguments=(--repo "$GITHUB_REPOSITORY" --base dev --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md")
          if [ -n "$LABELS" ]; then
            gh label create "$LABELS" --repo "$GITHUB_REPOSITORY" --color BFD4F2 --force
            arguments+=(--label "$LABELS")
          fi
          url="$(gh pr create "${arguments[@]}")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
      - name: Remove the fix branch when no pull request was opened
        if: always() && steps.open.outputs.number == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.plan.outputs.branch }}
        run: |
          case "$BRANCH" in
            harness/auto-fix-*) gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" ;;
            *) echo "::error::refusing to remove a branch outside harness/auto-fix-"; exit 1 ;;
          esac

  record:
    needs: [plan, reproduce, reproduction, fix, change, measure, branch, full-windows, full-macos, pull-request]
    if: ${{ always() && needs.plan.outputs.issue != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/post-merge-auto-fix
      - uses: actions/download-artifact@v4
        if: needs.change.outputs.change == 'ready'
        continue-on-error: true
        with:
          name: auto-fix-change
          path: ${{ runner.temp }}/auto-fix
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.source == 'agent'
        continue-on-error: true
        with:
          name: auto-fix-agent-output
          path: ${{ runner.temp }}/auto-fix-agent
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.source != 'prepared'
        continue-on-error: true
        with:
          name: auto-fix-reproduction
          path: ${{ runner.temp }}/auto-fix-reproduction
      - name: Write the attempt record to the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.plan.outputs.issue }}
          WORKFLOW: ${{ needs.plan.outputs.workflow }}
          OPEN_PR: ${{ needs.plan.outputs.open_pr }}
          REHEARSAL: ${{ needs.plan.outputs.rehearsal }}
          MODEL: ${{ needs.plan.outputs.model }}
          SOURCE: ${{ needs.change.outputs.source }}
          REQUESTED: ${{ needs.plan.outputs.source }}
          CHANGED: ${{ needs.change.outputs.change }}
          REFUSED: ${{ needs.change.outputs.refused }}
          PATCH_SHA: ${{ needs.change.outputs.patch_sha }}
          PLAN_SHA: ${{ needs.change.outputs.plan_sha }}
          VERDICT: ${{ needs.branch.outputs.verdict }}
          OPEN: ${{ needs.branch.outputs.open }}
          REQUIRED: ${{ needs.branch.outputs.required }}
          COMPARED: ${{ needs.branch.outputs.compared }}
          BEFORE: ${{ needs.branch.outputs.before }}
          AFTER: ${{ needs.branch.outputs.after }}
          REMAINING: ${{ needs.branch.outputs.remaining }}
          MISSING: ${{ needs.branch.outputs.missing }}
          PUSHED: ${{ needs.branch.outputs.pushed }}
          DUPLICATE: ${{ needs.branch.outputs.duplicate }}
          FULL: ${{ needs.pull-request.outputs.full_check }}
          PR: ${{ needs.pull-request.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/actions/post-merge-auto-fix/fix.mjs record --change "$RUNNER_TEMP/auto-fix" --agent "$RUNNER_TEMP/auto-fix-agent" --reproduction "$RUNNER_TEMP/auto-fix-reproduction" --patch-sha "$PATCH_SHA" --plan-sha "$PLAN_SHA" --source "${SOURCE:-$REQUESTED $MODEL}" --requested "$REQUESTED" --model "$MODEL" --workflow "$WORKFLOW" --open-pr "$OPEN_PR" --rehearsal "$REHEARSAL" --changed "$CHANGED" --refused "$REFUSED" --verdict "$VERDICT" --open "$OPEN" --required "$REQUIRED" --compared "$COMPARED" --before "$BEFORE" --after "$AFTER" --remaining "${REMAINING:-{\}}" --missing "${MISSING:-{\}}" --pushed "${PUSHED:-false}" --duplicate "${DUPLICATE:-0}" --full-check "$FULL" --pr "${PR:-0}" --run "$GITHUB_RUN_ID" --run-url "$RUN_URL" --out "$RUNNER_TEMP/record.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/record.md"
