name: tmp-process-identity

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  background:
    name: background windows-2022 ${{ matrix.variant }} x${{ matrix.parallel }} ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
        parallel: [2, 3]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore the plugin as it was before the fix
        if: matrix.variant == 'before'
        shell: bash
        run: git checkout origin/dev -- plugin/runtime/local-session.mjs plugin/runtime/local-session.test.mjs plugin/bin/harness-background.mjs plugin/bin/harness-background.test.mjs plugin/bin/harness-watch.mjs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare project dependencies with normal lifecycle scripts
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Generate policy contract types
        run: npm run db:generate
      - name: Repeat harness-background under load
        shell: pwsh
        env:
          STAGEKEEPER_RELEASED_READERS: required
        run: node .github/tmp/stress.mjs --file=plugin/bin/harness-background.test.mjs --rounds=10 --parallel=${{ matrix.parallel }} --label=background-${{ matrix.variant }}-x${{ matrix.parallel }}-${{ matrix.shard }}
