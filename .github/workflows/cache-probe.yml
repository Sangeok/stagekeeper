name: cache-probe
on:
  push:
    branches: [harness/auto-fix-cache-read]
permissions:
  contents: read
cache-mode: read
jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p "$RUNNER_TEMP/probe" && echo probe > "$RUNNER_TEMP/probe/file"
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/probe
          key: cache-probe-direct-${{ github.run_id }}
      - run: echo after-save-reached
  called-inherits:
    uses: ./.github/workflows/cache-probe-called.yml
    with:
      label: inherits
  called-job-level:
    uses: ./.github/workflows/cache-probe-called.yml
    cache-mode: read
    with:
      label: job-level
  control:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - run: mkdir -p "$RUNNER_TEMP/probe" && echo probe > "$RUNNER_TEMP/probe/file"
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/probe
          key: cache-probe-control-${{ github.run_id }}
