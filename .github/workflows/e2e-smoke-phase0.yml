name: e2e-smoke-phase0

on:
  push:
    branches: [harness/e2e-smoke-workflow]

permissions:
  contents: read

concurrency:
  group: e2e-smoke-phase0
  cancel-in-progress: true

jobs:
  agent-eval-probe:
    name: agent eval probe (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the scaffold alone
        shell: bash
        run: |
          set +e
          work="$RUNNER_TEMP/scaffold-check"
          mkdir -p "$work/ws" "$work/home"
          cd "$work/ws"
          env -i PATH="$PATH" HOME="$work/home" TMPDIR="$work" bash "$GITHUB_WORKSPACE/plugin/evals/rerun-asks-first/fixture.sh"
          echo "scaffold exit $?"
          echo "commits: $(git log --oneline | wc -l | tr -d ' ') files: $(git ls-files | wc -l | tr -d ' ') status: [$(git status --short | tr '\n' ' ')]"
          HARNESS_TEMPLATES_DIR=.stagekeeper-eval/templates HARNESS_SERVER=https://stagekeeper.invalid node "$GITHUB_WORKSPACE/plugin/bin/harness-init.mjs" --dry-run | head -3
          exit 0
      - name: Run the rerun case once
        shell: bash
        env:
          E2E_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: |
          set +e
          claude --version
          if [ -n "$E2E_TOKEN" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$E2E_TOKEN"
            echo "credentials: subscription token"
          else
            echo "credentials: none, so this run checks case loading and the scaffold only"
          fi
          unset E2E_TOKEN
          claude plugin eval plugin --case rerun-asks-first --runs 1 --trust-plugin --scaffold --allow-tools Bash --ablation none --no-publish --threshold 0.67 --json "$RUNNER_TEMP/eval.json"
          echo "eval exit $?"
          if [ -f "$RUNNER_TEMP/eval.json" ]; then
            node -e '
              const value = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const walk = (node, path, depth) => {
                if (node === null || typeof node !== "object") {
                  const text = typeof node === "string" && node.length > 160 && !path.endsWith(".error") ? `<${node.length} chars>` : JSON.stringify(node);
                  console.log(`${path} = ${text}`);
                  return;
                }
                if (depth > 6) { console.log(`${path} = <nested>`); return; }
                for (const [key, child] of Object.entries(node)) {
                  if (["prompt", "trace", "transcript", "messages", "stdout", "stderr"].includes(key)) { console.log(`${path}.${key} = <omitted>`); continue; }
                  walk(child, `${path}.${key}`, depth + 1);
                }
              };
              walk(value, "result", 0);
            ' "$RUNNER_TEMP/eval.json" | head -150
          else
            echo "no result file"
          fi
          exit 0
