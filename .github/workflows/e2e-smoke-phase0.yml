name: e2e-smoke-phase0

on:
  push:
    branches: [harness/e2e-smoke-workflow]

permissions:
  contents: read

concurrency:
  group: e2e-smoke-phase0
  cancel-in-progress: true

jobs:
  agent-eval-probe:
    name: agent eval probe (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Export the 0.5.28 plugin with the current eval cases
        shell: bash
        run: |
          git fetch --no-tags --depth 1 origin a750b765d0065023df43d4babffbbde30f7f808b
          mkdir -p "$RUNNER_TEMP/plugin-0528"
          git archive a750b765d0065023df43d4babffbbde30f7f808b plugin | tar -x -C "$RUNNER_TEMP/plugin-0528"
          cp -R plugin/evals "$RUNNER_TEMP/plugin-0528/plugin/evals"
          grep -m1 '"version"' "$RUNNER_TEMP/plugin-0528/plugin/.claude-plugin/plugin.json"
      - name: Write the eval summarizer
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/summarize.mjs" <<'NODE'
          import { execFileSync } from "node:child_process";
          import { existsSync, readdirSync, readFileSync } from "node:fs";
          import { dirname, join } from "node:path";

          const secretPatterns = [/hu_[A-Za-z0-9]{8,}/g, /hs_[A-Za-z0-9]{8,}/g, /sk-ant-[A-Za-z0-9_-]{8,}/g, /github_pat_[A-Za-z0-9_]{8,}/g, /gh[pousr]_[A-Za-z0-9]{8,}/g];
          const redact = (text) => secretPatterns.reduce((value, pattern) => value.replace(pattern, "<redacted>"), String(text));
          const flat = (text) => redact(text).replace(/\s+/g, " ").trim();
          const head = (text, limit) => { const value = flat(text); return value.length > limit ? `${value.slice(0, limit)} …(${value.length} chars)` : value; };
          const tail = (text, limit) => { const value = flat(text); return value.length > limit ? `(${value.length} chars)… ${value.slice(-limit)}` : value; };

          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          console.log(`cost ${result.costUsd} duration ${result.durationSeconds}s partial ${result.partial} ${result.partialReason ?? ""}`);
          for (const testCase of result.cases ?? []) {
            console.log(`case ${testCase.name} score ${testCase.aggregates?.score}`);
            for (const [index, run] of (testCase.arms?.with ?? []).entries()) {
              console.log(`run ${index}: score ${run.score} turns ${run.turns} error ${run.error}`);
              for (const grader of run.graders ?? []) console.log(`  grader ${head(JSON.stringify(grader), 500)}`);
              if (!run.tracePath || !existsSync(run.tracePath)) { console.log("  no trace"); continue; }
              let lastText = "";
              let resultText = "";
              for (const line of readFileSync(run.tracePath, "utf8").split("\n")) {
                if (!line.trim()) continue;
                let entry;
                try { entry = JSON.parse(line); } catch { continue; }
                if (entry.type === "result" && typeof entry.result === "string") resultText = entry.result;
                const blocks = Array.isArray(entry?.message?.content) ? entry.message.content : [];
                for (const block of blocks) {
                  if (block.type === "tool_use") console.log(`  call ${block.name}: ${head(block.input?.command ?? block.input?.skill ?? JSON.stringify(block.input), 260)}`);
                  else if (block.type === "tool_result") console.log(`  result: ${head(typeof block.content === "string" ? block.content : JSON.stringify(block.content), 200)}`);
                  else if (block.type === "text" && entry.type === "assistant") lastText = block.text;
                }
              }
              console.log(`  last message: ${tail(resultText || lastText, 900)}`);
              const root = dirname(dirname(run.tracePath));
              const entries = existsSync(root) ? readdirSync(root) : [];
              console.log(`  temp entries: ${entries.join(", ")}`);
              for (const name of entries) {
                const dir = join(root, name);
                if (!existsSync(join(dir, ".git"))) continue;
                const status = execFileSync("git", ["-C", dir, "status", "--short"], { encoding: "utf8" }).trim();
                const commits = execFileSync("git", ["-C", dir, "rev-list", "--count", "HEAD"], { encoding: "utf8" }).trim();
                console.log(`  workspace ${name}: commits ${commits} status [${status.split("\n").filter(Boolean).join(", ")}]`);
              }
            }
          }
          NODE
      - name: Run the rerun case per environment mechanism and plugin version
        shell: bash
        env:
          E2E_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: |
          set +e
          claude --version
          if [ -n "$E2E_TOKEN" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$E2E_TOKEN"
            echo "credentials: subscription token"
          else
            echo "credentials: none, so this run checks case loading only"
          fi
          unset E2E_TOKEN
          printf '%s\n' 'export HARNESS_TOKEN=hu_evalFixtureOnlyNoNetwork0000000000000000000' 'export HARNESS_SERVER=https://stagekeeper.invalid' 'export HARNESS_TEMPLATES_DIR=.stagekeeper-eval/templates' > "$RUNNER_TEMP/eval-env.sh"
          printf '%s\n' '#!/usr/bin/env bash' ". \"$RUNNER_TEMP/eval-env.sh\"" 'exec bash -c "$1"' > "$RUNNER_TEMP/eval-wrap.sh"
          chmod +x "$RUNNER_TEMP/eval-wrap.sh"
          run_eval() {
            label="$1"
            plugin_dir="$2"
            mode="$3"
            out="$RUNNER_TEMP/eval-$label-$mode.json"
            echo "::group::$label $mode"
            if [ "$mode" = env-file ]; then
              CLAUDE_ENV_FILE="$RUNNER_TEMP/eval-env.sh" claude plugin eval "$plugin_dir" --case rerun-asks-first --runs 1 --trust-plugin --scaffold --allow-tools Bash --ablation none --no-publish --keep-temp --threshold 0.67 --json "$out"
            else
              CLAUDE_CODE_SHELL_PREFIX="$RUNNER_TEMP/eval-wrap.sh" claude plugin eval "$plugin_dir" --case rerun-asks-first --runs 1 --trust-plugin --scaffold --allow-tools Bash --ablation none --no-publish --keep-temp --threshold 0.67 --json "$out"
            fi
            echo "eval exit $?"
            if [ -f "$out" ]; then node "$RUNNER_TEMP/summarize.mjs" "$out"; else echo "no result file"; fi
            echo "::endgroup::"
          }
          run_eval 0.5.29 plugin env-file
          run_eval 0.5.29 plugin shell-prefix
          run_eval 0.5.28 "$RUNNER_TEMP/plugin-0528/plugin" shell-prefix
          exit 0
