name: e2e-smoke-phase0

on:
  push:
    branches: [harness/e2e-smoke-workflow]
    paths: ["plugin/evals/**"]

permissions:
  contents: read

concurrency:
  group: e2e-smoke-phase0
  cancel-in-progress: true

jobs:
  agent-eval-probe:
    name: agent eval probe (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DISABLE_AUTOUPDATER: "1"
      EVAL_BASE: /private/tmp/sk-eval
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Copy 0.5.29 and 0.5.28 plugins outside the home directory
        shell: bash
        run: |
          git fetch --no-tags --depth 1 origin a750b765d0065023df43d4babffbbde30f7f808b
          rm -rf "$EVAL_BASE"
          mkdir -p "$EVAL_BASE/v0529" "$EVAL_BASE/v0528"
          cp -R plugin "$EVAL_BASE/v0529/plugin"
          git archive a750b765d0065023df43d4babffbbde30f7f808b plugin | tar -x -C "$EVAL_BASE/v0528"
          cp -R plugin/evals "$EVAL_BASE/v0528/plugin/evals"
          for label in v0529 v0528; do grep -m1 '"version"' "$EVAL_BASE/$label/plugin/.claude-plugin/plugin.json"; done
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/sk-eval-shell" <<'SH'
          #!/usr/bin/env bash
          export HARNESS_TOKEN=hu_evalFixtureOnlyNoNetwork0000000000000000000
          export HARNESS_SERVER=https://stagekeeper.invalid
          export HARNESS_TEMPLATES_DIR=.stagekeeper-eval/templates
          workspace="$HOME/cwd"
          [ -d "$workspace/.git" ] || workspace="$PWD"
          baseline="$workspace/.stagekeeper-eval/.baseline"
          [ -f "$baseline" ] && [ ! -e "$workspace/.eval-shell-active" ] && : > "$workspace/.eval-shell-active"
          bash -c "$1"
          status=$?
          if [ -f "$baseline" ] && [ -n "$(find "$workspace/docs" "$workspace/.claude" "$workspace/CLAUDE.md" -newer "$baseline" -type f 2>/dev/null | head -n 1)" ]; then
            : > "$workspace/.eval-managed-write"
          fi
          exit "$status"
          SH
          chmod 755 "$HOME/.local/bin/sk-eval-shell"
          control="$EVAL_BASE/v0529/plugin/evals/control-real-write"
          mkdir -p "$control"
          cp plugin/evals/rerun-asks-first/fixture.sh "$control/fixture.sh"
          cat > "$control/case.yaml" <<YAML
          schema_version: "1.1"
          name: control-real-write
          runs: 1
          context:
            scaffold_script: fixture.sh
          execution:
            prompt: "Run this exact command once with the Bash tool, then reply with the last line of its output: node $EVAL_BASE/v0529/plugin/bin/harness-init.mjs"
            max_turns: 4
            timeout_seconds: 180
          graders:
            - name: shell-prefix-active
              type: file_exists
              path: '**/.eval-shell-active'
            - name: no-write-before-yes
              type: file_exists
              path: '**/.eval-managed-write'
              exists: false
          YAML
          cat "$control/case.yaml"
      - name: Write the eval summarizer
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/summarize.mjs" <<'NODE'
          import { existsSync, readFileSync } from "node:fs";

          const secretPatterns = [/hu_[A-Za-z0-9]{8,}/g, /hs_[A-Za-z0-9]{8,}/g, /sk-ant-[A-Za-z0-9_-]{8,}/g, /github_pat_[A-Za-z0-9_]{8,}/g, /gh[pousr]_[A-Za-z0-9]{8,}/g];
          const redact = (text) => secretPatterns.reduce((value, pattern) => value.replace(pattern, "<redacted>"), String(text));
          const flat = (text) => redact(text).replace(/\s+/g, " ").trim();
          const head = (text, limit) => { const value = flat(text); return value.length > limit ? `${value.slice(0, limit)} …(${value.length} chars)` : value; };
          const tail = (text, limit) => { const value = flat(text); return value.length > limit ? `(${value.length} chars)… ${value.slice(-limit)}` : value; };

          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const resultClip = Number(process.argv[3] ?? 200);
          console.log(`cost ${result.costUsd} duration ${result.durationSeconds}s partial ${result.partial} ${result.partialReason ?? ""}`);
          for (const testCase of result.cases ?? []) {
            console.log(`case ${testCase.name} score ${testCase.aggregates?.score} passRate ${testCase.aggregates?.passRate}`);
            for (const [index, run] of (testCase.arms?.with ?? []).entries()) {
              console.log(`run ${index}: score ${run.score} turns ${run.turns} cost ${run.costUsd} seconds ${run.durationSeconds} error ${run.error} model ${run.model ?? "-"}`);
              console.log(`  fields ${Object.keys(run).join(",")}`);
              for (const grader of run.graders ?? []) console.log(`  grader ${head(JSON.stringify(grader), 500)}`);
              if (!run.tracePath || !existsSync(run.tracePath)) { console.log("  no trace"); continue; }
              let lastText = "";
              let resultText = "";
              for (const line of readFileSync(run.tracePath, "utf8").split("\n")) {
                if (!line.trim()) continue;
                let entry;
                try { entry = JSON.parse(line); } catch { continue; }
                if (entry.type === "result" && typeof entry.result === "string") resultText = entry.result;
                const blocks = Array.isArray(entry?.message?.content) ? entry.message.content : [];
                for (const block of blocks) {
                  if (block.type === "tool_use") console.log(`  call ${block.name}: ${head(block.input?.command ?? block.input?.skill ?? JSON.stringify(block.input), 260)}`);
                  else if (block.type === "tool_result") console.log(`  result: ${head(typeof block.content === "string" ? block.content : JSON.stringify(block.content), resultClip)}`);
                  else if (block.type === "text" && entry.type === "assistant") lastText = block.text;
                }
              }
              console.log(`  last message: ${tail(resultText || lastText, 900)}`);
            }
          }
          NODE
      - name: Run the rerun case against 0.5.29 and 0.5.28
        shell: bash
        env:
          E2E_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: |
          set +e
          claude --version
          if [ -n "$E2E_TOKEN" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$E2E_TOKEN"
            echo "credentials: subscription token"
          else
            echo "credentials: none, so this run checks case loading only"
          fi
          unset E2E_TOKEN
          run_eval() {
            label="$1"
            runs="$2"
            out="$RUNNER_TEMP/eval-$label-$runs.json"
            echo "::group::$label runs $runs"
            CLAUDE_CODE_SHELL_PREFIX="$HOME/.local/bin/sk-eval-shell" claude plugin eval "$EVAL_BASE/$label/plugin" --case rerun-asks-first --runs "$runs" -j "$runs" --model claude-opus-5-5 --trust-plugin --scaffold --allow-tools Bash --ablation none --no-publish --keep-temp --json "$out"
            echo "eval exit $?"
            if [ -f "$out" ]; then node "$RUNNER_TEMP/summarize.mjs" "$out"; else echo "no result file"; fi
            echo "::endgroup::"
          }
          echo "::group::control real write"
          CLAUDE_CODE_SHELL_PREFIX="$HOME/.local/bin/sk-eval-shell" claude plugin eval "$EVAL_BASE/v0529/plugin" --case control-real-write --runs 1 --model claude-haiku-5-5 --trust-plugin --scaffold --allow-tools Bash --ablation none --no-publish --keep-temp --json "$RUNNER_TEMP/eval-control.json"
          echo "eval exit $?"
          [ -f "$RUNNER_TEMP/eval-control.json" ] && node "$RUNNER_TEMP/summarize.mjs" "$RUNNER_TEMP/eval-control.json"
          echo "::endgroup::"
          run_eval v0528 3
          run_eval v0529 3
          exit 0
