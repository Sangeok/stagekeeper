name: e2e-smoke-phase0

on:
  push:
    branches: [harness/e2e-smoke-workflow]

permissions:
  contents: read

concurrency:
  group: e2e-smoke-phase0
  cancel-in-progress: true

jobs:
  agent-eval-probe:
    name: agent eval probe (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DISABLE_AUTOUPDATER: "1"
      EVAL_BASE: /private/tmp/sk-eval
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Claude Code
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Copy 0.5.29 and 0.5.28 plugins outside the home directory
        shell: bash
        run: |
          git fetch --no-tags --depth 1 origin a750b765d0065023df43d4babffbbde30f7f808b
          rm -rf "$EVAL_BASE"
          mkdir -p "$EVAL_BASE/v0529" "$EVAL_BASE/v0528"
          cp -R plugin "$EVAL_BASE/v0529/plugin"
          git archive a750b765d0065023df43d4babffbbde30f7f808b plugin | tar -x -C "$EVAL_BASE/v0528"
          cp -R plugin/evals "$EVAL_BASE/v0528/plugin/evals"
          printf '%s\n' '#!/usr/bin/env bash' 'export HARNESS_TOKEN=hu_evalFixtureOnlyNoNetwork0000000000000000000' 'export HARNESS_SERVER=https://stagekeeper.invalid' 'export HARNESS_TEMPLATES_DIR=.stagekeeper-eval/templates' 'exec bash -c "$1"' > "$EVAL_BASE/shell-prefix.sh"
          chmod 755 "$EVAL_BASE/shell-prefix.sh"
          for label in v0529 v0528; do
            mkdir -p "$EVAL_BASE/$label/plugin/eval-runtime"
            cp "$EVAL_BASE/shell-prefix.sh" "$EVAL_BASE/$label/plugin/eval-runtime/shell-prefix.sh"
            grep -m1 '"version"' "$EVAL_BASE/$label/plugin/.claude-plugin/plugin.json"
          done
          mkdir -p "$HOME/.local/bin"
          cp "$EVAL_BASE/shell-prefix.sh" "$HOME/.local/bin/sk-eval-prefix"
          cp "$EVAL_BASE/shell-prefix.sh" /opt/homebrew/bin/sk-eval-prefix || echo "no /opt/homebrew/bin copy"
          sudo install -m 755 "$EVAL_BASE/shell-prefix.sh" /usr/local/bin/sk-eval-prefix || echo "no /usr/local/bin copy"
          candidates="$EVAL_BASE/v0529/plugin/eval-runtime/shell-prefix.sh $EVAL_BASE/shell-prefix.sh $HOME/.local/bin/sk-eval-prefix /opt/homebrew/bin/sk-eval-prefix /usr/local/bin/sk-eval-prefix"
          echo "EVAL_PREFIX_CANDIDATES=$candidates" >> "$GITHUB_ENV"
          mkdir -p "$EVAL_BASE/v0529/plugin/evals/probe-sandbox"
          node -e '
            const [candidates, plugin, out] = process.argv.slice(1);
            const command = `for f in ${candidates}; do r=$(cat "$f" >/dev/null 2>&1 && echo read-ok || echo read-denied); x=$("$f" true >/dev/null 2>&1 && echo exec-ok || echo exec-denied); b=$(/bin/bash "$f" true >/dev/null 2>&1 && echo bash-ok || echo bash-denied); echo "$f $r $x $b"; done; node -e '"'"'require("fs").readFileSync(process.argv[1]); console.log("generator read-ok")'"'"' ${plugin}/bin/harness-init.mjs 2>&1 | tail -1`;
            const prompt = `Run this exact command once with the Bash tool, without changing it, then reply with its complete output and nothing else.\n\n${command}\n`;
            const yaml = [
              `schema_version: "1.1"`,
              `name: probe-sandbox`,
              `runs: 1`,
              `execution:`,
              `  prompt: ${JSON.stringify(prompt)}`,
              `  max_turns: 4`,
              `  timeout_seconds: 180`,
              `graders:`,
              `  - name: output-returned`,
              `    type: regex`,
              `    target: last_message`,
              `    pattern: "read-"`,
            ].join("\n");
            require("fs").writeFileSync(out, yaml + "\n");
          ' "$candidates" "$EVAL_BASE/v0529/plugin" "$EVAL_BASE/v0529/plugin/evals/probe-sandbox/case.yaml"
          cat "$EVAL_BASE/v0529/plugin/evals/probe-sandbox/case.yaml"
      - name: Write the eval summarizer
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/summarize.mjs" <<'NODE'
          import { existsSync, readFileSync } from "node:fs";

          const secretPatterns = [/hu_[A-Za-z0-9]{8,}/g, /hs_[A-Za-z0-9]{8,}/g, /sk-ant-[A-Za-z0-9_-]{8,}/g, /github_pat_[A-Za-z0-9_]{8,}/g, /gh[pousr]_[A-Za-z0-9]{8,}/g];
          const redact = (text) => secretPatterns.reduce((value, pattern) => value.replace(pattern, "<redacted>"), String(text));
          const flat = (text) => redact(text).replace(/\s+/g, " ").trim();
          const head = (text, limit) => { const value = flat(text); return value.length > limit ? `${value.slice(0, limit)} …(${value.length} chars)` : value; };
          const tail = (text, limit) => { const value = flat(text); return value.length > limit ? `(${value.length} chars)… ${value.slice(-limit)}` : value; };

          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const resultClip = Number(process.argv[3] ?? 200);
          console.log(`cost ${result.costUsd} duration ${result.durationSeconds}s partial ${result.partial} ${result.partialReason ?? ""}`);
          for (const testCase of result.cases ?? []) {
            console.log(`case ${testCase.name} score ${testCase.aggregates?.score} passRate ${testCase.aggregates?.passRate}`);
            for (const [index, run] of (testCase.arms?.with ?? []).entries()) {
              console.log(`run ${index}: score ${run.score} turns ${run.turns} cost ${run.costUsd} seconds ${run.durationSeconds} error ${run.error} model ${run.model ?? "-"}`);
              console.log(`  fields ${Object.keys(run).join(",")}`);
              for (const grader of run.graders ?? []) console.log(`  grader ${head(JSON.stringify(grader), 500)}`);
              if (!run.tracePath || !existsSync(run.tracePath)) { console.log("  no trace"); continue; }
              let lastText = "";
              let resultText = "";
              for (const line of readFileSync(run.tracePath, "utf8").split("\n")) {
                if (!line.trim()) continue;
                let entry;
                try { entry = JSON.parse(line); } catch { continue; }
                if (entry.type === "result" && typeof entry.result === "string") resultText = entry.result;
                const blocks = Array.isArray(entry?.message?.content) ? entry.message.content : [];
                for (const block of blocks) {
                  if (block.type === "tool_use") console.log(`  call ${block.name}: ${head(block.input?.command ?? block.input?.skill ?? JSON.stringify(block.input), 260)}`);
                  else if (block.type === "tool_result") console.log(`  result: ${head(typeof block.content === "string" ? block.content : JSON.stringify(block.content), resultClip)}`);
                  else if (block.type === "text" && entry.type === "assistant") lastText = block.text;
                }
              }
              console.log(`  last message: ${tail(resultText || lastText, 900)}`);
            }
          }
          NODE
      - name: Run the rerun case against 0.5.29 and 0.5.28
        shell: bash
        env:
          E2E_TOKEN: ${{ secrets.E2E_CLAUDE_OAUTH_TOKEN }}
        run: |
          set +e
          claude --version
          if [ -n "$E2E_TOKEN" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$E2E_TOKEN"
            echo "credentials: subscription token"
          else
            echo "credentials: none, so this run checks case loading only"
          fi
          unset E2E_TOKEN
          echo "::group::sandbox probe"
          claude plugin eval "$EVAL_BASE/v0529/plugin" --case probe-sandbox --runs 1 --model claude-haiku-5-5 --trust-plugin --allow-tools Bash --ablation none --no-publish --keep-temp --json "$RUNNER_TEMP/eval-probe.json"
          echo "eval exit $?"
          [ -f "$RUNNER_TEMP/eval-probe.json" ] && node "$RUNNER_TEMP/summarize.mjs" "$RUNNER_TEMP/eval-probe.json" 1200
          echo "::endgroup::"
          prefix_file=$(node -e '
            const result = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const trace = result.cases?.[0]?.arms?.with?.[0]?.tracePath;
            const text = trace ? require("fs").readFileSync(trace, "utf8") : "";
            for (const candidate of process.argv[2].split(" ")) {
              const escaped = candidate.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              if (new RegExp(`${escaped} read-ok exec-(?:ok|denied) bash-ok`).test(text)) { console.log(candidate); break; }
            }
          ' "$RUNNER_TEMP/eval-probe.json" "$EVAL_PREFIX_CANDIDATES")
          if [ -z "$prefix_file" ]; then
            echo "no readable wrapper location, so the case runs are skipped"
            exit 0
          fi
          echo "wrapper: $prefix_file"
          run_eval() {
            label="$1"
            runs="$2"
            out="$RUNNER_TEMP/eval-$label-$runs.json"
            wrapper="$prefix_file"
            [ "$prefix_file" = "$EVAL_BASE/v0529/plugin/eval-runtime/shell-prefix.sh" ] && wrapper="$EVAL_BASE/$label/plugin/eval-runtime/shell-prefix.sh"
            echo "::group::$label runs $runs"
            CLAUDE_CODE_SHELL_PREFIX="/bin/bash $wrapper" claude plugin eval "$EVAL_BASE/$label/plugin" --case rerun-asks-first --runs "$runs" -j "$runs" --model claude-opus-5-5 --trust-plugin --scaffold --allow-tools Bash --ablation none --no-publish --keep-temp --json "$out"
            echo "eval exit $?"
            if [ -f "$out" ]; then node "$RUNNER_TEMP/summarize.mjs" "$out"; else echo "no result file"; fi
            echo "::endgroup::"
          }
          run_eval v0529 1
          if node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); const g = (r.cases?.[0]?.arms?.with?.[0]?.graders ?? []).find((x) => x.name === "generator-ran"); process.exit(g?.passed ? 0 : 1)' "$RUNNER_TEMP/eval-v0529-1.json"; then
            run_eval v0529 3
            run_eval v0528 3
          else
            echo "the generator did not run in the environment check, so the full runs are skipped"
          fi
          exit 0
