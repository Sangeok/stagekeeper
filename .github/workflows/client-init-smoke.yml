name: client-init-smoke

on:
  pull_request:
    branches: [dev]
    paths:
      - "plugin/**"
      - "src/server/**"
      - "src/app/api/**"
      - "prisma/**"
      - "scripts/rehearsals/rehearse-client-init-smoke.ts"
      - "scripts/rehearsals/client-init-smoke-steps.mjs"
      - ".github/workflows/client-init-smoke.yml"
      - ".github/actions/smoke-database/**"
  workflow_dispatch:
    inputs:
      template_commit:
        description: Full private template commit SHA
        required: true
        default: 8ccb37a4ab91de527e6a23caa6d415c7cdc6f215
        type: string

permissions:
  contents: read

concurrency:
  group: client-init-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    name: claude (${{ matrix.os }}, ${{ matrix.scenario }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            scenario: new-user
            pg: windows-x64
          - os: windows-2022
            scenario: update
            pg: windows-x64
          - os: macos-15
            scenario: new-user
            pg: darwin-arm64
          - os: macos-15
            scenario: update
            pg: darwin-arm64
    env:
      PG_PORT: "45432"
      TEST_DB: postgresql://postgres@127.0.0.1:45432/stagekeeper_test_e2e
      DISABLE_AUTOUPDATER: "1"
    steps:
      - name: Check that the smoke secrets are available
        id: gate
        shell: bash
        env:
          TEMPLATES_TOKEN: ${{ secrets.E2E_TEMPLATES_TOKEN }}
        run: |
          if [ -z "$TEMPLATES_TOKEN" ]; then
            echo "::notice::E2E_TEMPLATES_TOKEN is not available to this run, so the client smoke is skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        if: steps.gate.outputs.ready == 'true'
        run: npm run db:generate
      - name: Prepare the smoke database
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/smoke-database
        with:
          pg-package: ${{ matrix.pg }}
          port: ${{ env.PG_PORT }}
          database: stagekeeper_test_e2e
      - name: Build the server
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: DATABASE_URL="$TEST_DB" npm run build
      - name: Check out the private templates
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.template_commit || '8ccb37a4ab91de527e6a23caa6d415c7cdc6f215' }}
          repository: Sangeok/harness-templates
          token: ${{ secrets.E2E_TEMPLATES_TOKEN }}
          path: plugin/templates
          persist-credentials: false
      - name: Install Claude Code (Windows)
        if: steps.gate.outputs.ready == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Claude Code (macOS)
        if: steps.gate.outputs.ready == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Resolve the previous release
        id: previous
        if: steps.gate.outputs.ready == 'true' && matrix.scenario == 'update'
        shell: bash
        run: |
          git fetch --no-tags --depth 1 origin main
          echo "commit=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run the client init smoke
        if: steps.gate.outputs.ready == 'true'
        shell: pwsh
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DB }}
          PLUGIN_BRANCH: ${{ github.head_ref || github.ref_name }}
          PLUGIN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SCENARIO: ${{ matrix.scenario }}
          TEMPLATE_COMMIT: ${{ inputs.template_commit || '8ccb37a4ab91de527e6a23caa6d415c7cdc6f215' }}
          PREVIOUS_REF: ${{ steps.previous.outputs.commit }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          claude --version
          $templates = Join-Path $env:GITHUB_WORKSPACE 'plugin/templates'
          $summary = Join-Path $env:RUNNER_TEMP 'smoke-summary.json'
          $arguments = @('--import', 'tsx', 'scripts/rehearsals/rehearse-client-init-smoke.ts', '--client', 'claude', '--scenario', $env:SCENARIO, '--templates', $templates, '--template-commit', $env:TEMPLATE_COMMIT, '--plugin-source', 'github-branch', '--plugin-branch', $env:PLUGIN_BRANCH, '--plugin-commit', $env:PLUGIN_COMMIT)
          if ($env:PREVIOUS_REF) { $arguments += @('--previous-ref', $env:PREVIOUS_REF) }
          node @arguments | Tee-Object -FilePath $summary
          $code = $LASTEXITCODE
          if (Test-Path $summary) { "``````json`n$((Get-Content $summary | Select-Object -Last 1))`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          exit $code
